name: Tests

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: ['11.*', '12.*']

    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}

    steps:
      - uses: actions/checkout@v4

      - name: Checkout PHP SDK (for path dependency until Packagist)
        uses: actions/checkout@v4
        with:
          repository: datalumo/php
          path: php-sdk
        continue-on-error: true

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          # Prefer Packagist once published. Until then CI may inject a path repo.
          if [ -d php-sdk ]; then
            composer config repositories.datalumo-php path php-sdk
            composer require datalumo/php:@dev --no-update
          fi
          composer require "illuminate/contracts:${{ matrix.laravel }}" --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest
